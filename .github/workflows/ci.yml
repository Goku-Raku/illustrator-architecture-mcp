name: Alpha verification and release

on:
  push:
    branches: ['**']
    tags: ['v*.*.*-alpha.*']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:offline
      - run: npm run verify:package

  alpha-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Require an exact alpha tag and registry-publish guard
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm run build
      - run: npm run verify:package
      - name: Create the versioned runtime tarball and checksum
        run: |
          npm pack --ignore-scripts
          sha256sum illustrator-architecture-mcp-*.tgz > SHA256SUMS
      # Source archives are supplied by GitHub automatically. Runtime tarballs
      # contain built code and guidance; they do not include node_modules.
      # No npm publish, MCP Registry upload, MCPB installer or OIDC credential.
      # Keep the release a draft until a maintainer attaches the Illustrator-made
      # editable demo masters and verifies the complete public asset set.
      - name: Assemble the alpha draft for final asset verification
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          make_latest: 'false'
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            Public-source alpha for editable architectural and urban site diagrams in Adobe Illustrator.

            Install from the source checkout or the attached runtime .tgz; dependencies still require npm registry access or a populated npm cache. Read README.md (繁體中文), README.zh-CN.md, README.en.md or README.ja.md for installation and CC Switch management.

            CI checks the offline protocol and clean package installation on Windows, macOS and Linux with Node 22 and 24. This does not certify live Illustrator compatibility; see docs/VALIDATION-ALPHA.md for the separately recorded application checks and limitations.
          files: |
            illustrator-architecture-mcp-*.tgz
            SHA256SUMS
